[project]
name = "pLIN"
version = "2.1.0"
description = "Plasmid Lineage Identification Number — hierarchical classification system for bacterial plasmid genomes with integrated AMR surveillance"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.10"
authors = [
    {name = "Basil Xavier Britto"},
]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.0",
    "scipy>=1.12",
    "biopython>=1.80",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "streamlit>=1.31.0",
    "plotly>=5.18.0",
    "python-pptx>=0.6.21",
    "requests>=2.31.0",
    "joblib>=1.3",
]

[project.urls]
Homepage = "https://github.com/xavierbasilbritto-hub/pLIN-plasmid-classification"
Repository = "https://github.com/xavierbasilbritto-hub/pLIN-plasmid-classification"
