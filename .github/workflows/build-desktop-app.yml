name: Build pLIN desktop app

# Builds standalone pLIN desktop apps for Windows, macOS, and Linux using
# PyInstaller. PyInstaller cannot cross-compile: each platform's build
# must run on that platform's own OS, so this workflow uses GitHub's own
# windows-latest / macos-latest / ubuntu-latest runners to build all three
# in parallel, then uploads each as a downloadable artifact.
#
# Trigger:
#   - Automatically on any push of a tag matching v* (e.g. v3.1.0)
#   - Manually via the "Run workflow" button in the Actions tab
#     (workflow_dispatch), for testing without cutting a real release tag
#
# Output:
#   Three build artifacts (pLIN-windows, pLIN-macos, pLIN-linux), each
#   downloadable from the workflow run's summary page for 90 days. If
#   triggered by a version tag, they are also attached to a GitHub Release
#   for that tag automatically.
#
# AMRFinderPlus bundling (macOS/Linux only):
#   bioconda ships a native AMRFinderPlus build for macOS and Linux but not
#   for Windows, so on those two platforms this workflow installs
#   AMRFinderPlus (plus its own BLAST+/HMMER dependencies and gene
#   database) into a dedicated conda env before the PyInstaller build, and
#   points the build at it via the PLIN_AMRFINDER_ENV_DIR environment
#   variable, which desktop_app/pLIN.spec reads to copy those binaries and
#   the database into the app bundle. Windows continues to rely on the
#   existing WSL bridge (see plin_app.py's detect_amrfinder()) rather than
#   a bundled binary, since none exists for native win-64.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

# The release job needs write access to create a GitHub Release and
# attach files to it; this repo's default workflow token permissions are
# read-only, which silently fails that step ("Resource not accessible by
# integration") without this explicit grant.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: pLIN-windows
          - os: macos-latest
            artifact_name: pLIN-macos
          - os: ubuntu-latest
            artifact_name: pLIN-linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # Bundled MMseqs2 (all platforms): pLIN v4.1 uses it to place proteins that are new to the
      # database. The official static build of release 18-8cc5c, the version that built the database.
      - name: Download MMseqs2 18-8cc5c
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Windows) A=mmseqs-win64.zip ;;
            macOS)   A=mmseqs-osx-universal.tar.gz ;;
            Linux)   A=mmseqs-linux-sse41.tar.gz ;;
          esac
          curl -sSfL -o "$A" "https://github.com/soedinglab/MMseqs2/releases/download/18-8cc5c/$A"
          mkdir -p mmseqs_dl
          if [ "${{ runner.os }}" = "Windows" ]; then unzip -q "$A" -d mmseqs_dl; else tar xzf "$A" -C mmseqs_dl; fi
          echo "PLIN_MMSEQS_DIR=$GITHUB_WORKSPACE/mmseqs_dl/mmseqs" >> "$GITHUB_ENV"

      # Bundled AMRFinderPlus: macOS and Linux only (see note above). This
      # runs in its own conda env (separate from the PyInstaller build's
      # own Python/pip setup above) purely to obtain the AMRFinderPlus
      # binary, its BLAST+/HMMER dependencies, and its gene database as
      # files on disk for the spec file to copy, nothing from this env is
      # imported into the Python build itself.
      - name: Set up Miniconda for AMRFinderPlus (macOS/Linux)
        if: matrix.os != 'windows-latest'
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: amrfinder-bundle
          channels: bioconda,conda-forge

      - name: Install AMRFinderPlus into the bundle env (macOS/Linux)
        if: matrix.os != 'windows-latest'
        shell: bash -el {0}
        run: |
          conda install -y -n amrfinder-bundle ncbi-amrfinderplus
          AMRFINDER_ENV_DIR="$CONDA_PREFIX"
          "$AMRFINDER_ENV_DIR/bin/amrfinder" -u
          echo "PLIN_AMRFINDER_ENV_DIR=$AMRFINDER_ENV_DIR" >> "$GITHUB_ENV"
          "$AMRFINDER_ENV_DIR/bin/amrfinder" --version

      - name: Build with PyInstaller (macOS/Linux, with bundled AMRFinderPlus env active)
        if: matrix.os != 'windows-latest'
        shell: bash -el {0}
        run: |
          pyinstaller desktop_app/pLIN.spec --noconfirm

      - name: Build with PyInstaller (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          pyinstaller desktop_app/pLIN.spec --noconfirm

      # Each zip holds the app, a step-by-step README_FIRST.txt for that system and the example data.
      - name: Add install guide and example data
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Windows) G=README_FIRST_Windows.txt ;;
            macOS)   G=README_FIRST_macOS.txt ;;
            Linux)   G=README_FIRST_Linux.txt ;;
          esac
          cp "desktop_app/install/$G" dist/README_FIRST.txt
          mkdir -p dist/sample_data
          cp -R sample_data/swiss_vim1_outbreak dist/sample_data/

      - name: Package build output (Windows/Linux)
        if: matrix.os != 'macos-latest'
        shell: bash
        run: |
          cd dist
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            powershell -Command "\$ErrorActionPreference = 'Stop'; Compress-Archive -Path pLIN,README_FIRST.txt,sample_data -DestinationPath ../pLIN-windows.zip"
            test -s ../pLIN-windows.zip
          else
            zip -r ../pLIN-linux.zip pLIN README_FIRST.txt sample_data
          fi

      - name: Package build output (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          cd dist
          zip -r -y ../pLIN-macos.zip pLIN.app README_FIRST.txt sample_data

      # Smoke tests on every platform (after zipping, so the shipped build is exactly what was built): the bundled MMseqs2 searches, the v4.1 database downloads with
      # matching checksums, known plasmids get their published codes, and the packaged app starts.
      - name: Smoke test pLIN v4.1 typing
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then export PLIN_MMSEQS="$PLIN_MMSEQS_DIR/mmseqs.bat";
          else export PLIN_MMSEQS="$PLIN_MMSEQS_DIR/bin/mmseqs"; fi
          python tests/smoke_v41.py --release-dir "$RUNNER_TEMP/plin_v41"

      - name: Smoke test the packaged app
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Windows) EXE=dist/pLIN/pLIN.exe ;;
            macOS)   EXE=dist/pLIN.app/Contents/MacOS/pLIN ;;
            Linux)   EXE=dist/pLIN/pLIN ;;
          esac
          test -n "$(find dist -name plin_v41_typer.py | head -1)" || { echo "v4.1 modules missing from bundle"; exit 1; }
          test -n "$(find dist -path '*mmseqs*' -name 'mmseqs*' -type f | head -1)" || { echo "MMseqs2 missing from bundle"; exit 1; }
          "$EXE" --selftest || { echo "packaged-app self-test failed"; exit 1; }
          "$EXE" > app.log 2>&1 &
          for i in $(seq 1 120); do curl -sf http://localhost:8501/_stcore/health && break; sleep 2; done
          curl -sf http://localhost:8501/_stcore/health || { echo "app did not start"; cat app.log; exit 1; }
          echo " app is up"
          # stop the app so its files are not locked when the build is zipped (Windows)
          if [ "${{ runner.os }}" = "Windows" ]; then taskkill //IM pLIN.exe //F //T || true; else kill %1 || true; fi
          sleep 5

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: pLIN-*.zip
          if-no-files-found: error
          retention-days: 90

  release:
    # Only runs when triggered by a version tag push, not by manual
    # workflow_dispatch testing runs.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # The pLIN v4.1 database is not attached here: it is its own release (db-YYYY.MM.DD tags) and on
      # Zenodo, and the app downloads it on first use.
      - name: Create GitHub Release with the platform builds
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.zip
          body_path: .github/RELEASE_NOTES.md
          generate_release_notes: false
