name: Build pLIN desktop app

# Builds standalone pLIN desktop apps for Windows, macOS, and Linux using
# PyInstaller. PyInstaller cannot cross-compile — each platform's build
# must run on that platform's own OS — so this workflow uses GitHub's own
# windows-latest / macos-latest / ubuntu-latest runners to build all three
# in parallel, then uploads each as a downloadable artifact.
#
# Trigger:
#   - Automatically on any push of a tag matching v* (e.g. v3.1.0)
#   - Manually via the "Run workflow" button in the Actions tab
#     (workflow_dispatch), for testing without cutting a real release tag
#
# Output:
#   Three build artifacts (pLIN-windows, pLIN-macos, pLIN-linux), each
#   downloadable from the workflow run's summary page for 90 days. If
#   triggered by a version tag, they are also attached to a GitHub Release
#   for that tag automatically.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: pLIN-windows
          - os: macos-latest
            artifact_name: pLIN-macos
          - os: ubuntu-latest
            artifact_name: pLIN-linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller desktop_app/pLIN.spec --noconfirm

      - name: Package build output (Windows/Linux)
        if: matrix.os != 'macos-latest'
        shell: bash
        run: |
          cd dist
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            powershell -Command "Compress-Archive -Path pLIN -DestinationPath ../pLIN-windows.zip"
          else
            zip -r ../pLIN-linux.zip pLIN
          fi

      - name: Package build output (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          cd dist
          zip -r ../pLIN-macos.zip pLIN.app

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: pLIN-*.zip
          retention-days: 90

  release:
    # Only runs when triggered by a version tag push, not by manual
    # workflow_dispatch testing runs.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release with all three platform builds attached
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
          generate_release_notes: true
