services:
  plin:
    build:
      context: .
      args:
        INSTALL_BIOTOOLS: "true"
    image: plin:2.1.0
    container_name: plin-app
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./output:/app/output
    restart: unless-stopped
    environment:
      - STREAMLIT_SERVER_MAX_UPLOAD_SIZE=200
    deploy:
      resources:
        limits:
          memory: 4G
